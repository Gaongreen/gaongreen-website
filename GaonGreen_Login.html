<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GaonGreen | Login</title><style>
:root{--forest:#123c2f;--green:#2f7654;--mint:#dff2e7;--cream:#f7f8f3;--ink:#17251e;--muted:#5f6e65;--line:#dce5dd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 10%,#dff2e7,transparent 40%),var(--cream);font-family:Inter,Arial,"Noto Sans KR","Noto Sans Arabic",sans-serif;color:var(--ink);min-height:100vh}header{max-width:1050px;margin:auto;padding:26px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:800;font-size:1.4rem;color:var(--forest);text-decoration:none}.brand b{display:inline-grid;place-items:center;background:var(--forest);color:white;width:35px;height:35px;border-radius:11px;margin-inline-end:8px}.langs{display:flex;gap:5px;background:#e9eee8;border-radius:30px;padding:4px}.langs button{border:0;background:transparent;padding:9px;border-radius:24px;cursor:pointer}.langs button.active{background:var(--forest);color:white}main{max-width:460px;margin:45px auto 80px;padding:0 18px}.panel{background:white;border:1px solid var(--line);border-radius:25px;padding:34px;box-shadow:0 20px 60px #123c2f10}h1{font-size:2rem;color:var(--forest);line-height:1.2;margin:0 0 24px}label{display:block;font-size:.9rem;font-weight:700;margin:18px 0 7px}input{width:100%;border:1px solid #b8c8bc;border-radius:12px;padding:13px 14px;font-size:1rem;outline-offset:2px}button.main{width:100%;border:0;background:var(--forest);color:white;padding:14px;border-radius:13px;font-weight:750;font-size:1rem;cursor:pointer;margin-top:22px}button.main:disabled{opacity:.55;cursor:wait}a{color:var(--green)}.foot{margin-top:20px;text-align:center;color:var(--muted);font-size:.93rem}.note{font-size:.83rem;line-height:1.6;background:#f1f7f1;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:22px;color:#46584c}.status{display:none;padding:12px;border-radius:12px;margin:16px 0 0;line-height:1.5;overflow-wrap:anywhere}.status.show{display:block}.status.ok{background:#e4f5e9;color:#175b33}.status.error{background:#fff0ed;color:#92362a}.textbtn{border:0;background:transparent;color:var(--green);cursor:pointer;text-decoration:underline;font:inherit;padding:0}.hidden{display:none!important}.session{padding:16px;border:1px solid var(--line);border-radius:12px;background:#f6faf6;overflow-wrap:anywhere}.secondary{display:inline-block;margin-top:14px;text-align:center;width:100%;text-decoration:none;padding:12px;border:1px solid var(--forest);border-radius:12px;color:var(--forest)}@media(max-width:480px){main{margin-top:20px}.panel{padding:25px}}</style></head><body>
<header><a class="brand" href="./index.html"><b>G</b>GaonGreen</a><div class="langs" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="ar">عربي</button></div></header>
<main><div class="panel"><section id="authForm"><h1 data-t="login"></h1><form id="form"><label for="email" data-t="email"></label><input id="email" type="email" autocomplete="email" required><label for="password" data-t="password"></label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="main" type="submit" id="submit" data-t="submitLogin"></button></form>
<div class="foot"><button type="button" class="textbtn" id="forgot" data-t="forgot"></button></div><div class="foot"><a href="./GaonGreen_Register.html" data-t="registerLink"></a></div></section>
<section id="resetForm" class="hidden"><h1 data-t="forgot"></h1><form id="reset"><label for="resetEmail" data-t="email"></label><input id="resetEmail" type="email" required><button type="submit" class="main" data-t="reset"></button></form><div class="foot"><button type="button" class="textbtn" id="back" data-t="back"></button></div></section>
<section id="updateForm" class="hidden"><h1 data-t="reset"></h1><form id="update"><label for="newPassword" data-t="password"></label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"><button type="submit" class="main" data-t="reset"></button></form></section>
<section id="signedIn" class="hidden"><h1 data-t="signedIn"></h1><div class="session" id="sessionEmail"></div><a class="secondary" href="./GaonGreen_ESG_Dashboard_Cloud_Beta.html" data-t="dashboard"></a><button type="button" class="main" id="logout" data-t="logout"></button></section>
<div class="status" id="status" role="status" aria-live="polite"></div><div class="note" data-t="demo"></div></div><div class="foot"><a href="./index.html" data-t="home"></a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const CONFIG={url:"https://uyhmbecltrswiljbyass.supabase.co",key:"sb_publishable_iNcId4rsFBAYbnIudemYVg_FSEFdPa-",base:"https://gaongreen.github.io/gaongreen-website/",mode:"login"};
const words={"en": {"register": "Create your account", "login": "Sign in", "email": "Email address", "password": "Password", "confirm": "Confirm password", "submitRegister": "Create account", "submitLogin": "Sign in", "forgot": "Forgot password?", "have": "Already have an account?", "new": "New to GaonGreen?", "reset": "Send password reset email", "back": "Back to sign in", "logout": "Sign out", "dashboard": "Open ESG Dashboard", "verified": "Check your email for a confirmation link, then return here to sign in.", "resetSent": "If the address is registered, a password reset email will arrive shortly.", "signedIn": "You are signed in.", "signedOut": "Signed out.", "weak": "Password must contain at least 8 characters.", "mismatch": "Passwords do not match.", "missing": "Enter your email and password.", "demo": "Early-access account portal. ESG tools currently save information locally in your browser; signing in does not synchronize or protect that data.", "home": "GaonGreen homepage", "working": "Please wait…", "noSession": "Sign in to continue.", "registerLink": "Create an account", "loginLink": "Sign in instead"}, "ko": {"register": "계정 만들기", "login": "로그인", "email": "이메일 주소", "password": "비밀번호", "confirm": "비밀번호 확인", "submitRegister": "회원가입", "submitLogin": "로그인", "forgot": "비밀번호를 잊으셨나요?", "have": "이미 계정이 있으신가요?", "new": "처음 방문하셨나요?", "reset": "비밀번호 재설정 이메일 보내기", "back": "로그인으로 돌아가기", "logout": "로그아웃", "dashboard": "ESG 대시보드 열기", "verified": "확인 이메일을 확인하고 링크를 클릭한 후 로그인해 주세요.", "resetSent": "등록된 이메일이라면 비밀번호 재설정 안내가 발송됩니다.", "signedIn": "로그인되었습니다.", "signedOut": "로그아웃되었습니다.", "weak": "비밀번호는 8자 이상이어야 합니다.", "mismatch": "비밀번호가 일치하지 않습니다.", "missing": "이메일과 비밀번호를 입력해 주세요.", "demo": "초기 계정 포털입니다. ESG 도구의 정보는 현재 브라우저에만 저장되며 로그인으로 데이터가 동기화되거나 보호되지는 않습니다.", "home": "가온그린 홈페이지", "working": "잠시만 기다려 주세요…", "noSession": "계속하려면 로그인해 주세요.", "registerLink": "계정 만들기", "loginLink": "로그인하기"}, "ar": {"register": "إنشاء حساب", "login": "تسجيل الدخول", "email": "البريد الإلكتروني", "password": "كلمة المرور", "confirm": "تأكيد كلمة المرور", "submitRegister": "إنشاء الحساب", "submitLogin": "تسجيل الدخول", "forgot": "هل نسيت كلمة المرور؟", "have": "لديك حساب بالفعل؟", "new": "جديد في GaonGreen؟", "reset": "إرسال رابط إعادة تعيين كلمة المرور", "back": "العودة إلى تسجيل الدخول", "logout": "تسجيل الخروج", "dashboard": "فتح لوحة تحكم ESG", "verified": "تحقق من بريدك الإلكتروني واضغط رابط التأكيد، ثم عد لتسجيل الدخول.", "resetSent": "إذا كان البريد مسجلاً، ستصلك رسالة لإعادة تعيين كلمة المرور.", "signedIn": "تم تسجيل الدخول.", "signedOut": "تم تسجيل الخروج.", "weak": "يجب أن تتكون كلمة المرور من 8 أحرف على الأقل.", "mismatch": "كلمتا المرور غير متطابقتين.", "missing": "أدخل البريد الإلكتروني وكلمة المرور.", "demo": "بوابة حسابات تجريبية. ما زالت بيانات أدوات ESG محفوظة في متصفحك فقط؛ تسجيل الدخول لا يزامن هذه البيانات ولا يحميها.", "home": "الصفحة الرئيسية", "working": "يرجى الانتظار…", "noSession": "سجل الدخول للمتابعة.", "registerLink": "إنشاء حساب", "loginLink": "تسجيل الدخول"}};
let language='en';
try{const saved=localStorage.getItem('gaongreen-language');if(words[saved])language=saved;}catch(e){}
const $=id=>document.getElementById(id);
function tr(key){return (words[language]||words.en)[key]||key;}
function translate(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=tr(el.dataset.t);});document.querySelectorAll('[data-lang]').forEach(el=>{el.classList.toggle('active',el.dataset.lang===language);el.setAttribute('aria-pressed',String(el.dataset.lang===language));});}
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>{language=btn.dataset.lang;try{localStorage.setItem('gaongreen-language',language);}catch(e){}translate();}));translate();
function message(text,ok=false){const box=$('status');box.textContent=text;box.className='status show '+(ok?'ok':'error');}
function clearMessage(){$('status').className='status';$('status').textContent='';}
function show(section){['authForm','resetForm','updateForm','signedIn'].forEach(id=>$(id).classList.toggle('hidden',id!==section));clearMessage();}
function busy(form,isBusy){form.querySelectorAll('button').forEach(btn=>btn.disabled=isBusy);}
if(!window.supabase){message('Unable to load authentication library. Check your internet connection.');}
else{
 const client=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const loginRedirect=CONFIG.base+'GaonGreen_Login.html';
 async function displaySession(){const {data,error}=await client.auth.getUser();if(!error&&data.user){$('sessionEmail').textContent=data.user.email||'';show('signedIn');}else{show('authForm');}}
 client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){show('updateForm');}else if(event==='SIGNED_OUT'){show('authForm');}});
 $('form').addEventListener('submit',async ev=>{ev.preventDefault();clearMessage();const form=ev.currentTarget;const email=$('email').value.trim(),password=$('password').value;if(!email||!password){message(tr('missing'));return;}if(password.length<8){message(tr('weak'));return;}if(CONFIG.mode==='register'&&password!==$('confirm').value){message(tr('mismatch'));return;}busy(form,true);try{if(CONFIG.mode==='register'){const {error}=await client.auth.signUp({email,password,options:{emailRedirectTo:loginRedirect}});if(error)throw error;message(tr('verified'),true);form.reset();}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;await displaySession();}}catch(e){message(e.message||String(e));}finally{busy(form,false);}});
 if($('forgot'))$('forgot').addEventListener('click',()=>{$('resetEmail').value=$('email').value;show('resetForm');});
 if($('back'))$('back').addEventListener('click',()=>show('authForm'));
 $('reset').addEventListener('submit',async ev=>{ev.preventDefault();const form=ev.currentTarget;busy(form,true);try{const {error}=await client.auth.resetPasswordForEmail($('resetEmail').value.trim(),{redirectTo:loginRedirect});if(error)throw error;message(tr('resetSent'),true);}catch(e){message(e.message||String(e));}finally{busy(form,false);}});
 $('update').addEventListener('submit',async ev=>{ev.preventDefault();const form=ev.currentTarget;busy(form,true);try{const {error}=await client.auth.updateUser({password:$('newPassword').value});if(error)throw error;await client.auth.signOut();show('authForm');message(tr('signedOut'),true);}catch(e){message(e.message||String(e));}finally{busy(form,false);}});
 $('logout').addEventListener('click',async()=>{const {error}=await client.auth.signOut();if(error)message(error.message);else{show('authForm');message(tr('signedOut'),true);}});
 const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('type')==='recovery')show('updateForm');else displaySession();
}
</script></body></html>
