en:{title:'ESG Evidence Checklist',intro:'Track which records support your ESG entries. Record only document references—not confidential content. Nothing is uploaded to GaonGreen.',sections:['Company profile','Energy and emissions','Water and waste','People','Governance and targets'],names:['Business registration / company details','Financial statements / annual revenue','Electricity bills or meter readings','Renewable electricity certificates / contracts','Fuel invoices and conversion records','Emissions calculations and factor sources','Water bills / meter records','Waste disposal and recycling receipts','HR headcount and turnover records','Workplace injury / safety logs','Management oversight / approvals','Risk assessments and management plans','Targets and progress records'],status:'Evidence status',reference:'Document reference (optional)',placeholder:'e.g., Electricity_Bills_2025.pdf',options:['Not reviewed','Available','Missing','Needs review','Not applicable'],progress:'Available evidence',save:'Save evidence checklist',export:'Download evidence backup',import:'Import evidence backup',clear:'Clear evidence checklist',saved:'Checklist saved on this device.',exported:'Evidence backup downloaded. Keep it secure.',imported:'Evidence backup imported.',invalid:'Could not import this evidence backup.',cleared:'Evidence checklist cleared.',confirm:'Clear the evidence checklist?',note:'Evidence status is self-reported. “Available” does not mean verified, and this checklist does not establish K-ISSB compliance.'},
ko:{title:'ESG 증빙자료 체크리스트',intro:'ESG 입력값을 뒷받침하는 자료를 관리하세요. 기밀 문서 자체가 아닌 파일명 등 참조 정보만 기록합니다. 가온그린 서버로 업로드되지 않습니다.',sections:['기업 정보','에너지 및 온실가스','물 및 폐기물','인력','거버넌스 및 목표'],names:['사업자등록증 / 회사 정보','재무제표 / 연간 매출액','전기요금 고지서 / 계량 기록','재생전력 인증서 / 계약서','연료 구매 및 환산 자료','배출량 산정 및 배출계수 출처','수도요금 고지서 / 계량 기록','폐기물 처리 및 재활용 증빙','인사 및 퇴사자 기록','산업재해 / 안전 기록','경영진 감독 / 승인 문서','위험 평가 및 관리 계획','목표 및 이행 현황 자료'],status:'증빙 상태',reference:'문서 참조명 (선택)',placeholder:'예: Electricity_Bills_2025.pdf',options:['미검토','보유','누락','검토 필요','해당 없음'],progress:'보유 증빙',save:'증빙 체크리스트 저장',export:'증빙 백업 다운로드',import:'증빙 백업 가져오기',clear:'증빙 체크리스트 초기화',saved:'이 기기에 저장했습니다.',exported:'증빙 백업을 다운로드했습니다. 안전하게 보관하세요.',imported:'증빙 백업을 가져왔습니다.',invalid:'증빙 백업을 가져올 수 없습니다.',cleared:'증빙 체크리스트를 초기화했습니다.',confirm:'증빙 체크리스트를 초기화할까요?',note:'증빙 상태는 사용자가 입력한 정보입니다. 보유 상태는 검증을 의미하지 않으며 K-ISSB 준수를 보장하지 않습니다.'},
ar:{title:'قائمة أدلة ESG',intro:'تتبّع المستندات الداعمة لبيانات الاستدامة. سجّل مراجع الملفات فقط، وليس محتوياتها السرية. لا تُرفع أي ملفات إلى GaonGreen.',sections:['معلومات الشركة','الطاقة والانبعاثات','المياه والنفايات','الموظفون','الحوكمة والأهداف'],names:['تسجيل الشركة / بياناتها','القوائم المالية / الإيرادات السنوية','فواتير الكهرباء / قراءات العدادات','شهادات / عقود الكهرباء المتجددة','فواتير الوقود وسجلات التحويل','حسابات الانبعاثات ومصادر المعاملات','فواتير المياه / سجلات العدادات','إيصالات النفايات وإعادة التدوير','سجلات الموظفين والمغادرين','سجلات إصابات العمل والسلامة','إشراف الإدارة / الموافقات','تقييم المخاطر وخطط إدارتها','سجلات الأهداف والتقدم'],status:'حالة الدليل',reference:'مرجع المستند (اختياري)',placeholder:'مثال: Electricity_Bills_2025.pdf',options:['لم يُراجع','متوفر','مفقود','يحتاج مراجعة','غير منطبق'],progress:'الأدلة المتوفرة',save:'حفظ قائمة الأدلة',export:'تنزيل نسخة الأدلة',import:'استيراد نسخة الأدلة',clear:'مسح قائمة الأدلة',saved:'تم حفظ القائمة على هذا الجهاز.',exported:'تم تنزيل نسخة الأدلة. احتفظ بها بأمان.',imported:'تم استيراد نسخة الأدلة.',invalid:'تعذّر استيراد نسخة الأدلة.',cleared:'تم مسح قائمة الأدلة.',confirm:'هل تريد مسح قائمة الأدلة؟',note:'حالة الأدلة مُدخلة من المستخدم ولا تعني التحقق أو إثبات الامتثال لمعايير K-ISSB.'}};
let data=items.map(()=>({status:0,reference:''}));
const root=document.createElement('section');root.id='ggEvidence';root.className='gg-evidence';document.getElementById('ggAssistant')?.after(root);
if(!root.parentNode)document.getElementById('ggSavePanel').after(root);
const lang=()=>document.getElementById('language').value;
const t=()=>tx[lang()]||tx.en;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function collect(){root.querySelectorAll('[data-evidence]').forEach(el=>{const i=+el.dataset.evidence;if(el.dataset.kind==='status')data[i].status=+el.value;else data[i].reference=el.value.slice(0,250)})}
function draw(){const v=t();root.innerHTML='<div class="gg-evidence-box"><h2>'+v.title+'</h2><p class="gg-evidence-muted">'+v.intro+'</p><p id="ggEvidenceProgress" class="gg-evidence-progress"></p><div class="gg-evidence-grid">'+items.map(([section],i)=>'<div class="gg-evidence-card"><small>'+esc(v.sections[['profile','energy','environment','people','disclosure'].indexOf(section)])+'</small><h3>'+esc(v.names[i])+'</h3><label>'+v.status+'<select data-evidence="'+i+'" data-kind="status">'+v.options.map((o,j)=>'<option value="'+j+'" '+(data[i].status===j?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label><label>'+v.reference+'<input type="text" maxlength="250" data-evidence="'+i+'" data-kind="reference" value="'+esc(data[i].reference)+'" placeholder="'+esc(v.placeholder)+'"></label></div>').join('')+'</div><div class="gg-evidence-actions"><button type="button" id="ggEvidenceSave">'+v.save+'</button><button type="button" class="alt" id="ggEvidenceExport">'+v.export+'</button><button type="button" class="alt" id="ggEvidenceImport">'+v.import+'</button><button type="button" class="alt" id="ggEvidenceClear">'+v.clear+'</button></div><input type="file" id="ggEvidenceFile" accept=".json,application/json" hidden><p class="gg-evidence-status" id="ggEvidenceStatus" role="status"></p><p class="gg-evidence-muted">'+v.note+'</p></div>';progress();}
function progress(){const a=data.filter(x=>x.status===1).length;document.getElementById('ggEvidenceProgress').textContent=t().progress+': '+a+' / '+items.length}
function msg(key){document.getElementById('ggEvidenceStatus').textContent=t()[key]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}
function download(){const blob=new Blob([JSON.stringify({type:'GaonGreenEvidence',version:1,data},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='GaonGreen_ESG_Evidence_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
root.addEventListener('input',e=>{if(e.target.matches('[data-evidence]')){collect();progress();persist()}});
root.addEventListener('change',e=>{if(e.target.matches('[data-evidence]')){collect();progress();persist()}});
root.addEventListener('click',e=>{const id=e.target.id;if(id==='ggEvidenceSave'){collect();try{localStorage.setItem(KEY,JSON.stringify(data));msg('saved')}catch{msg('invalid')}}if(id==='ggEvidenceExport'){collect();download();msg('exported')}if(id==='ggEvidenceImport')document.getElementById('ggEvidenceFile').click();if(id==='ggEvidenceClear'&&confirm(t().confirm)){data=items.map(()=>({status:0,reference:''}));try{localStorage.removeItem(KEY)}catch{}draw();msg('cleared')}});
root.addEventListener('change',async e=>{if(e.target.id!=='ggEvidenceFile')return;try{const file=e.target.files[0];if(!file||file.size>100000)throw Error();const o=JSON.parse(await file.text());if(o.type!=='GaonGreenEvidence'||o.version!==1||!Array.isArray(o.data)||o.data.length!==items.length||!o.data.every(x=>Number.isInteger(x.status)&&x.status>=0&&x.status<=4&&typeof x.reference==='string'&&x.reference.length<=250))throw Error();data=o.data;persist();draw();msg('imported')}catch{msg('invalid')}finally{e.target.value=''}});
document.getElementById('language').addEventListener('change',()=>{collect();persist();draw()});
try{const stored=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(stored)&&stored.length===items.length&&stored.every(x=>Number.isInteger(x.status)&&x.status>=0&&x.status<=4&&typeof x.reference==='string'))data=stored}catch{}
draw();
})();</script></body></html>
